workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Unzip, Generate All Missing Files & Build APK
        script: |
          unzip -o "*.zip"
          
          # 1. إنشاء أيقونات التطبيق بصيغة XML و PNG لضمان توافق كل الإصدارات
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://android.com">
              <background android:drawable="@android:color/holo_blue_dark"/>
              <foreground android:drawable="@android:drawable/ic_dialog_info"/>
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          # 2. إنشاء مجلد values وتوليد ملفات الثيمات والألوان الاحتياطية
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.GeminiArabicAssistant" parent="android:Theme.Material.Light.NoActionBar" />
              <style name="Theme.GeminiApp" parent="android:Theme.Material.Light.NoActionBar" />
              <style name="Theme.AppCompat.Light.NoActionBar" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
          </resources>
          EOF

          # 3. إنشاء ملفات XML الخاصة بقواعد الأندرويد الحديث (Backup & Data Extraction)
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content />
          EOF
          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup />
          </data-extraction-rules>
          EOF

          # 4. ضبط اسم الثيم في AndroidManifest.xml ليطابق الثيم الذي أنشأناه دون تعارض
          sed -i.bak 's/android:theme="@style\/[^"]*"/android:theme="@style\/Theme.GeminiArabicAssistant"/g' app/src/main/AndroidManifest.xml

          # 5. إنشاء ملفات Gradle الأساسية للمشروع
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GeminiApp"
          include(":app")
          EOF
          
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF
          
          # 6. تشغيل البناء النهائي
          gradle assembleDebug
    artifacts:
      - "app/build/outputs/apk/debug/*.apk"
