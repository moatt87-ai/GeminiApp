workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Unzip and Build APK
        script: |
          unzip -o "*.zip"
          ROOT_DIR=$(dirname "$(find . -maxdepth 3 -name "settings.gradle*" | head -n 1)")
          cd "$ROOT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - "**/build/outputs/apk/debug/*.apk"
