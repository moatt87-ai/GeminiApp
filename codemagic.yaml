workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          unzip -o "*.zip"
          python3 -c '
          import os, re
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)
          os.makedirs("app/src/main/res/values", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/java/com/gemini/arabicassistant", exist_ok=True)
          icon = """<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://android.com"><background android:drawable="@android:color/holo_blue_dark"/><foreground android:drawable="@android:drawable/ic_dialog_info"/></adaptive-icon>"""
          open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w").write(icon)
          open("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", "w").write(icon)
          open("app/src/main/res/values/themes.xml", "w").write("""<?xml version="1.0" encoding="utf-8"?><resources><style name="Theme.GeminiArabicAssistant" parent="android:Theme.Material.Light.NoActionBar" /></resources>""")
          open("app/src/main/res/values/colors.xml", "w").write("""<?xml version="1.0" encoding="utf-8"?><resources><color name="black">#FF000000</color><color name="white">#FFFFFFFF</color></resources>""")
          open("app/src/main/res/xml/backup_rules.xml", "w").write("""<?xml version="1.0" encoding="utf-8"?><full-backup-content />""")
          open("app/src/main/res/xml/data_extraction_rules.xml", "w").write("""<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup /></data-extraction-rules>""")
          m = open("app/src/main/AndroidManifest.xml").read()
          m = re.sub(r"android:theme=\"@style/[^\"]*\"", "android:theme=\"@style/Theme.GeminiArabicAssistant\"", m)
          open("app/src/main/AndroidManifest.xml", "w").write(m)
          open("app/src/main/java/com/gemini/arabicassistant/AssistantApplication.kt", "w").write("package com.gemini.arabicassistant\nimport android.app.Application\nclass AssistantApplication : Application()\n")
          '
          cat << 'EOF' > app/src/main/java/com/gemini/arabicassistant/MainActivity.kt
          package com.gemini.arabicassistant
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.*
          import com.gemini.arabicassistant.actions.DeviceActionExecutor
          import com.gemini.arabicassistant.data.GeminiFlashRepository
          import com.gemini.arabicassistant.data.SecurePrefsManager
          import com.gemini.arabicassistant.service.FloatingBubbleService
          import com.gemini.arabicassistant.ui.chat.MainChatScreen
          import com.gemini.arabicassistant.ui.chat.UiChatMessage
          import com.gemini.arabicassistant.ui.onboarding.ApiKeyScreen
          import com.gemini.arabicassistant.ui.settings.InstalledAppItem
          import com.gemini.arabicassistant.ui.settings.SettingsScreen
          import kotlinx.coroutines.launch
          import java.util.UUID

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = SecurePrefsManager(applicationContext)
                  val executor = DeviceActionExecutor(applicationContext, prefs)
                  val repository = GeminiFlashRepository(prefs, executor)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          var hasApiKey by remember { mutableStateOf(prefs.hasValidApiKey()) }
                          var showSettings by remember { mutableStateOf(false) }
                          var assistantName by remember { mutableStateOf(prefs.getAssistantName()) }
                          var wallpaperUri by remember { mutableStateOf(prefs.getWallpaperUri()) }
                          var dimAlpha by remember { mutableFloatStateOf(prefs.getWallpaperDimming()) }
                          var blacklisted by remember { mutableStateOf(prefs.getBlacklistedPackages()) }
                          val messages = remember { mutableStateListOf(UiChatMessage("welcome", false, "أهلاً بك! أنا $assistantName، كيف يمكنني مساعدتك اليوم؟")) }
                          var isSending by remember { mutableStateOf(false) }
                          val scope = rememberCoroutineScope()
                          val permissionLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { }
                          LaunchedEffect(Unit) {
                              val perms = mutableListOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS, Manifest.permission.WRITE_CONTACTS)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                              permissionLauncher.launch(perms.toTypedArray())
                          }
                          val sendAction: (String) -> Unit = { text ->
                              messages.add(UiChatMessage(UUID.randomUUID().toString(), true, text))
                              isSending = true
                              scope.launch {
                                  val result = repository.sendMessage(text)
                                  messages.add(UiChatMessage(UUID.randomUUID().toString(), false, result.replyText))
                                  isSending = false
                              }
                          }
                          val voiceLauncher = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                              val spoken = res.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()
                              if (!spoken.isNullOrBlank()) sendAction(spoken)
                          }
                          if (!hasApiKey) {
                              ApiKeyScreen(prefs.getUserName(), repository) { validKey ->
                                  prefs.saveGeminiApiKey(validKey)
                                  hasApiKey = true
                              }
                          } else if (showSettings) {
                              val installedApps = remember {
                                  val pm = packageManager
                                  pm.getInstalledApplications(PackageManager.GET_META_DATA)
                                      .filter { pm.getLaunchIntentForPackage(it.packageName) != null }
                                      .map { InstalledAppItem(pm.getApplicationLabel(it).toString(), it.packageName) }
                                      .sortedBy { it.label }
                              }
                              SettingsScreen(assistantName, dimAlpha, installedApps, blacklisted,
                                  { assistantName = it; prefs.saveAssistantName(it) },
                                  { wallpaperUri = it; prefs.saveWallpaperUri(it) },
                                  { dimAlpha = it; prefs.saveWallpaperDimming(it) },
                                  { blacklisted = it; prefs.saveBlacklistedPackages(it) },
                                  { showSettings = false }
                              )
                          } else {
                              MainChatScreen(assistantName, wallpaperUri, dimAlpha, messages, isSending, sendAction,
                                  {
                                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ar-SA")
                                      }
                                      runCatching { voiceLauncher.launch(intent) }.onFailure { Toast.makeText(this, "الصوت غير مدعوم", Toast.LENGTH_SHORT).show() }
                                  },
                                  { showSettings = true },
                                  {
                                      if (!Settings.canDrawOverlays(this)) {
                                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                                      } else {
                                          val s = Intent(this, FloatingBubbleService::class.java)
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(s) else startService(s)
                                      }
                                  }
                              )
                          }
                      }
                  }
              }
          }
          EOF
          printf "org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n" > gradle.properties
